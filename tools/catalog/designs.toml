# The pieces. Each names a renderer family in tools/artwork/ and the layers it stacks;
# the palettes and recipes that colour a family live beside its renderer, keyed by the
# `palette` each variant states here.
#
# `source` is the layer's stable identity for seeding. It is never read as a path, and
# must not change unless the artwork is intentionally regenerated with a new seed.
#
# `rotation` is how many seconds one full turn takes, signed: negative runs
# anticlockwise. A layer without one is static, and a multi-layer piece's periods do
# not divide each other so it never settles. `parallax` is the layer's parallaxScale.
#
# `scaler` is the remix's inputRotationScaler. MotionMath.SPIN_WRAP_TURNS = 4, and
# BundledCatalogRepository refuses a catalogue where scaler x 4 is not a whole number
# of turns, so only multiples of 0.25 are legal.

# ---- The house piece ------------------------------------------------------------------------
# First in the file because it is first in the collection: it is what a fresh install opens
# on, so its tile is the one already carrying the selection ring when the sheet comes up.

[[design]]
id = "gyrestack"
label = "Gyre Stack"
family = "spinner_gyre"
scaler = 0.25

  [[design.layer]]
  source = "procedural/originals/spinner_gyre/background.webp"
  parallax = 0.0

  [[design.layer]]
  source = "procedural/originals/spinner_gyre/outer.png"
  rotation = 420.0
  parallax = 0.12

  [[design.layer]]
  source = "procedural/originals/spinner_gyre/middle.png"
  rotation = -300.0
  parallax = 0.24

  [[design.layer]]
  source = "procedural/originals/spinner_gyre/inner.png"
  rotation = 180.0
  parallax = 0.36

  [[design.variant]]
  slug = "house"
  label = "House Colours"
  palette = "0"

  [[design.variant]]
  slug = "seaglass"
  label = "Sea Glass"
  palette = "1"

  [[design.variant]]
  slug = "nightbloom"
  label = "Night Bloom"
  palette = "2"

  [[design.variant]]
  slug = "verdigris"
  label = "Verdigris"
  palette = "3"

  [[design.variant]]
  slug = "saffron"
  label = "Saffron"
  palette = "4"

  [[design.variant]]
  slug = "ultramarine"
  label = "Ultramarine"
  palette = "5"

